<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body >

    <div class="container my-5">
        <h2 class="text-center mb-4">Sleep Tracker</h2>

        <div class="border border-3 rounded-full p-4">
            <h4 class="mb-3">Log Sleep</h4>
            <form name="sleepForm" id="sleepForm">

                <div class="mb-3">
                    <label for="day"  class="form-label">Day</label>
                    <select class="form-control" id="day" name="day" >
                        <option value="" disabled selected>Select Day</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>

                <div  class="mb-3">
                    <label for="date"  class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" >
                </div>

                <div class="mb-3">
                    <label for="quality"  class="form-label">Sleep Quality</label>
                    <input type="text" class="form-control" id="quality" name="quality"
                        placeholder="Enter quality letter" maxlength="1" >
                    <div class="form-text text-muted mt-2">
                        <strong>Guide:</strong>
                        <span class="badge bg-success">E</span> Excellent |
                        <span class="badge bg-info text-dark">G</span> Good |
                        <span class="badge bg-primary">F</span> Fair |
                        <span class="badge bg-warning text-dark">P</span> Poor |
                        <span class="badge bg-danger">W</span> Worst
                    </div>
                </div>

                <button type="submit" class="addLog btn btn-primary w-100">Add Log</button>
            </form>
        </div>

       
        <div class="border border-3 rounded p-4 mt-4">
            <h4 class="mb-3">Sleep History</h4>
           
                <table class="table align-middle">
                    <thead>
                        <tr>
                          
                            <th>Day</th>
                            <th>Date</th>
                            <th>Quality</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody class="data">
                    </tbody>
                </table>
        
        </div>


    </div>

    <script src="secmain.js"></script>
</body>

</html>
